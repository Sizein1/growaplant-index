<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index des pets</title>
<meta name="description" content="Index non officiel des pets de Grow a Plant : nom, rareté et capacités passives.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-title="pets.title">
<div class="wrap">
  <header class="banner studs">
    <h1 class="outline" data-i18n="pets.title">🐾 Index des pets</h1>
    <p class="sub outline" data-i18n="pets.sub">Grow a Plant · index non officiel · capacités passives de base</p>
  </header>
  <nav class="tabs" aria-label="Rubriques" data-i18n-aria="nav.label">
    <a class="tab outline" href="./" data-i18n="nav.plants">🌱 Plantes</a>
    <a class="tab outline" href="pets.html" aria-current="page" data-i18n="nav.pets">🐾 Pets</a>
    <a class="tab outline" href="trades.html" data-i18n="nav.trades">🤝 Trades</a>
    <a class="tab outline" href="giveaways.html" data-i18n="nav.giveaways">🎁 Giveaways</a>
    <button class="tab lang outline" type="button" id="lang" data-i18n="lang.switch">🇬🇧 English</button>
  </nav>

  <details class="duos" id="duos">
    <summary class="outline" data-i18n="duo.title">🏆 Meilleurs duos par capacité</summary>
    <div class="duos-body">
      <p class="duos-hint" data-i18n="duo.hint"></p>
      <div class="removed" id="removed" hidden></div>
      <div class="duo-grid" id="duoGrid"></div>
    </div>
  </details>

  <div class="controls">
    <div class="row">
      <input type="search" id="q" placeholder="Rechercher un pet ou une capacité (ex. Money)…" aria-label="Rechercher un pet ou une capacité" data-i18n-placeholder="pets.search" data-i18n-aria="pets.search">
      <select id="sort" aria-label="Trier" data-i18n-aria="sort.label">
        <option value="rarity" data-i18n="sort.rarity">Tri : rareté</option>
        <option value="name" data-i18n="sort.name">Tri : nom A → Z</option>
        <option value="powers" data-i18n="sort.powers">Tri : nombre de capacités</option>
      </select>
    </div>
    <div class="chips none-active" id="chips" role="group" aria-label="Filtrer par rareté" data-i18n-aria="filter.label"></div>
    <div class="count" id="count"></div>
  </div>

  <main class="grid" id="grid"></main>
  <p class="empty outline" id="empty" hidden data-i18n="pets.empty">Aucun pet ne correspond.</p>
  <footer class="outline" data-i18n="footer">Données et images tirées du jeu. Site de fan, sans lien avec les créateurs de Grow a Plant.</footer>
</div>

<script src="i18n.js"></script>
<script src="pets-data.js"></script>
<script>
  const RARITIES = [
    ["Common", "#9aa0a8"], ["Uncommon", "#38b84c"], ["Rare", "#2f8ff0"], ["Epic", "#a24df0"],
    ["Legendary", "#f0b020"], ["Mythic", "#f0405f"], ["SECRET", "#24252b"], ["VOID", "#5b2fd6"],
    ["EXCLUSIVE", "#ff7a1a"], ["CELESTIAL", "#22b8cf"],
  ];
  const ORDER = Object.fromEntries(RARITIES.map(([r], i) => [r, i]));
  const COLOR = Object.fromEntries(RARITIES);
  const pets = window.PETS || [];
  const active = new Set();

  // Boutons de rareté avec le nombre de pets
  const chips = document.getElementById("chips");
  for (const [r, c] of RARITIES) {
    const n = pets.filter((p) => p.rarity === r).length;
    if (!n) continue;
    const b = document.createElement("button");
    b.className = "chip outline"; b.type = "button"; b.dataset.r = r; b.style.setProperty("--c", c);
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = `${r}<span class="n">${n}</span>`;
    b.onclick = () => {
      active.has(r) ? active.delete(r) : active.add(r);
      b.setAttribute("aria-pressed", String(active.has(r)));
      chips.classList.toggle("none-active", active.size === 0);
      render();
    };
    chips.appendChild(b);
  }

  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  const sort = document.getElementById("sort");
  q.oninput = sort.onchange = render;

  function render() {
    const term = q.value.trim().toLowerCase();
    // La recherche porte sur le nom ET les capacités ("money" trouve tous les pets qui boostent l'argent)
    const list = pets.filter((p) => (!active.size || active.has(p.rarity)) &&
      (!term || p.name.toLowerCase().includes(term) || p.powers.some((pw) => pw.toLowerCase().includes(term))));
    const by = {
      "rarity": (a, b) => (ORDER[a.rarity] ?? 99) - (ORDER[b.rarity] ?? 99) || a.name.localeCompare(b.name, LANG),
      "name": (a, b) => a.name.localeCompare(b.name, LANG),
      "powers": (a, b) => b.powers.length - a.powers.length || (ORDER[b.rarity] ?? 99) - (ORDER[a.rarity] ?? 99),
    }[sort.value];
    list.sort(by);

    grid.replaceChildren(...list.map((p) => {
      const el = document.createElement("article");
      el.className = "card";
      el.innerHTML = `
        <div class="pic">
          <img loading="lazy" width="360" height="360">
          <span class="badge outline" data-r="${p.rarity}" style="--c:${COLOR[p.rarity] || "#777"}">${p.rarity}</span>
        </div>
        <div class="info">
          <span class="name outline"></span>
          <ul class="powers"></ul>
          <div class="tags"></div>
        </div>`;
      const img = el.querySelector("img");
      img.src = `images/pets/${p.id}.jpg`; img.alt = p.name;
      el.querySelector(".name").textContent = p.name;
      const ul = el.querySelector(".powers");
      for (const pw of p.powers.length ? p.powers : [t("pets.none")]) {
        const li = document.createElement("li");
        li.textContent = pw;
        if (!p.powers.length) li.className = "none";
        ul.appendChild(li);
      }
      const tags = el.querySelector(".tags");
      for (const [flag, cls, label] of [[p.event, "event", t("tag.event")], [p.flying, "fly", t("tag.fly")], [p.noTrade, "notrade", t("tag.notrade")]]) {
        if (!flag) continue;
        const t = document.createElement("span");
        t.className = `tag outline ${cls}`; t.textContent = label;
        tags.appendChild(t);
      }
      return el;
    }));
    document.getElementById("count").textContent = t("pets.count", { n: list.length, s: list.length > 1 ? "s" : "", total: pets.length });
    document.getElementById("empty").hidden = list.length > 0;
  }
  // ---------- Meilleurs duos par capacité ----------
  // Lit la valeur dans le texte de la capacité : "x1.25 Grow Speed", "+6% Pack Luck", "-30% Tricky Visitors",
  // "+x3 Watering", "+2h Boost Money Offline"... Pour chaque capacité, plus le chiffre est grand, mieux c'est.
  const parsePower = (text) => {
    const m = text.match(/^[+\-]?x?(\d+(?:\.\d+)?)(?:%|h)?\s+(.+)$/);
    return m ? { value: parseFloat(m[1]), label: m[2], text } : null;
  };

  // label -> pets classés du meilleur au moins bon (à égalité : le plus rare d'abord)
  const abilities = new Map();
  for (const p of pets) {
    for (const text of p.powers) {
      const pw = parsePower(text);
      if (!pw) continue;
      if (!abilities.has(pw.label)) abilities.set(pw.label, []);
      abilities.get(pw.label).push({ pet: p, value: pw.value, text });
    }
  }
  for (const list of abilities.values()) {
    list.sort((a, b) => b.value - a.value || (ORDER[b.pet.rarity] ?? 0) - (ORDER[a.pet.rarity] ?? 0));
  }
  // Les capacités les plus répandues en premier
  const abilityOrder = [...abilities.keys()].sort((a, b) => abilities.get(b).length - abilities.get(a).length || a.localeCompare(b));

  // Pets que tu n'as pas : retirés de tous les duos, mémorisés dans le navigateur
  let notOwned = new Set();
  try { notOwned = new Set(JSON.parse(localStorage.getItem("petsNotOwned") || "[]")); } catch (e) { /* pas de stockage : liste vide */ }
  const saveNotOwned = () => { try { localStorage.setItem("petsNotOwned", JSON.stringify([...notOwned])); } catch (e) { /* ignoré */ } };

  const duoGrid = document.getElementById("duoGrid");
  const removedBox = document.getElementById("removed");

  function renderDuos() {
    duoGrid.replaceChildren(...abilityOrder.map((label) => {
      const all = abilities.get(label);
      const best = all.filter((e) => !notOwned.has(e.pet.id)).slice(0, 2);
      const box = document.createElement("section");
      box.className = "duo";
      const h = document.createElement("h3");
      h.className = "outline"; h.textContent = label;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = t("duo.count", { n: all.length, s: all.length > 1 ? "s" : "" });
      box.append(h, meta);
      for (let i = 0; i < 2; i++) {
        const e = best[i];
        if (!e) {
          const slot = document.createElement("div");
          slot.className = "empty-slot"; slot.textContent = t("duo.none");
          box.appendChild(slot);
          continue;
        }
        const row = document.createElement("div");
        row.className = "duo-pet";
        row.innerHTML = `
          <img loading="lazy" width="48" height="48" alt="">
          <div class="who"><b></b><span class="val"></span><span class="rk outline" style="--c:${COLOR[e.pet.rarity] || "#777"}">${e.pet.rarity}</span></div>
          <button class="x" type="button">✕</button>`;
        row.querySelector("img").src = `images/pets/${e.pet.id}.jpg`;
        row.querySelector("b").textContent = e.pet.name;
        row.querySelector(".val").textContent = e.text;
        const x = row.querySelector(".x");
        x.title = t("duo.remove"); x.setAttribute("aria-label", `${t("duo.remove")} : ${e.pet.name}`);
        x.onclick = () => { notOwned.add(e.pet.id); saveNotOwned(); renderDuos(); };
        box.appendChild(row);
      }
      return box;
    }));

    // Liste des pets retirés, chacun avec un bouton pour le remettre
    removedBox.hidden = notOwned.size === 0;
    if (!notOwned.size) { removedBox.replaceChildren(); return; }
    const label = document.createElement("span");
    label.textContent = t("duo.removed");
    const buttons = [...notOwned].map((id) => {
      const pet = pets.find((p) => p.id === id);
      const b = document.createElement("button");
      b.type = "button"; b.textContent = `↩ ${pet ? pet.name : id}`;
      b.setAttribute("aria-label", t("duo.restore", { name: pet ? pet.name : id }));
      b.onclick = () => { notOwned.delete(id); saveNotOwned(); renderDuos(); };
      return b;
    });
    const reset = document.createElement("button");
    reset.type = "button"; reset.className = "reset"; reset.textContent = t("duo.reset");
    reset.onclick = () => { notOwned.clear(); saveNotOwned(); renderDuos(); };
    removedBox.replaceChildren(label, ...buttons, reset);
  }

  window.onLangChange = () => { render(); renderDuos(); }; // le bouton de langue réaffiche tout
  render();
  renderDuos();
</script>
</body>
</html>
