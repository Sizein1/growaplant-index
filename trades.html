<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trades</title>
<meta name="description" content="Annonces de trade Grow a Plant : propose un échange de pets ou d’œufs, ou dis ce que tu recherches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-title="trades.title">
<div class="wrap">
  <header class="banner studs">
    <h1 class="outline" data-i18n="trades.title">🤝 Trades</h1>
    <p class="sub outline" data-i18n="trades.sub"></p>
  </header>
  <nav class="tabs" aria-label="Rubriques" data-i18n-aria="nav.label">
    <a class="tab outline" href="./" data-i18n="nav.plants">🌱 Plantes</a>
    <a class="tab outline" href="pets.html" data-i18n="nav.pets">🐾 Pets</a>
    <a class="tab outline" href="trades.html" aria-current="page" data-i18n="nav.trades">🤝 Trades</a>
    <button class="tab lang outline" type="button" id="lang" data-i18n="lang.switch">🇬🇧 English</button>
  </nav>

  <p class="safety" data-i18n="trades.safety"></p>
  <div class="account" id="account" aria-live="polite"></div>

  <details class="post" id="post">
    <summary class="outline" data-i18n="trades.new">➕ Publier une annonce</summary>
    <div class="form" id="loginPrompt" hidden>
      <p class="duos-hint" data-i18n="trades.loginToPost"></p>
      <div class="row"><a class="btn discord" href="/api/auth/login" data-i18n="trades.login"></a></div>
    </div>
    <form class="form" id="form" novalidate hidden>
      <fieldset>
        <legend data-i18n="trades.kind"></legend>
        <div class="kinds">
          <label><input type="radio" name="kind" value="offer" checked> <span data-i18n="trades.kind.offer"></span></label>
          <label><input type="radio" name="kind" value="request"> <span data-i18n="trades.kind.request"></span></label>
        </div>
      </fieldset>

      <fieldset id="haveBox">
        <legend><span data-i18n="trades.have"></span> <span class="pick-count" id="haveCount"></span></legend>
        <div class="items" id="haveItems"></div>
        <input type="search" class="pick-search" id="haveSearch" data-i18n-placeholder="trades.pick" data-i18n-aria="trades.pick">
        <div class="pick-grid" id="haveGrid" role="group" data-i18n-aria="trades.have"></div>
      </fieldset>

      <fieldset>
        <legend><span id="wantLegend" data-i18n="trades.want"></span> <span class="pick-count" id="wantCount"></span></legend>
        <div class="items" id="wantItems"></div>
        <input type="search" class="pick-search" id="wantSearch" data-i18n-placeholder="trades.pick" data-i18n-aria="trades.pick">
        <div class="pick-grid" id="wantGrid" role="group" data-i18n-aria="trades.want"></div>
      </fieldset>

      <label><span data-i18n="trades.note"></span><textarea id="note" maxlength="300"></textarea></label>
      <label><span data-i18n="trades.roblox"></span><input type="text" id="roblox" maxlength="20" autocomplete="username" required></label>
      <div class="row"><button class="btn green" type="submit" id="publish" data-i18n="trades.publish"></button></div>
      <p class="form-msg" id="formMsg" role="status" aria-live="polite"></p>
    </form>
  </details>

  <div class="controls">
    <div class="row">
      <input type="search" id="q" data-i18n-placeholder="trades.search" data-i18n-aria="trades.search">
      <select id="kindFilter" data-i18n-aria="trades.kind">
        <option value="all" data-i18n="trades.filter.all"></option>
        <option value="offer" data-i18n="trades.filter.offer"></option>
        <option value="request" data-i18n="trades.filter.request"></option>
      </select>
    </div>
    <div class="count" id="count"></div>
  </div>

  <main class="trade-list" id="list"></main>
  <p class="empty outline" id="empty" hidden></p>
  <footer class="outline" data-i18n="footer"></footer>
</div>

<script src="i18n.js"></script>
<script src="pets-data.js"></script>
<script src="eggs-data.js"></script>
<script>
  const RARITY_ORDER = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Mythic", "SECRET", "VOID", "EXCLUSIVE", "CELESTIAL"];
  const RARITY_COLOR = {
    Common: "#9aa0a8", Uncommon: "#38b84c", Rare: "#2f8ff0", Epic: "#a24df0", Legendary: "#f0b020",
    Mythic: "#f0405f", SECRET: "#24252b", VOID: "#5b2fd6", EXCLUSIVE: "#ff7a1a", CELESTIAL: "#22b8cf",
  };
  // Les plus rares d'abord
  const pets = (window.PETS || []).slice().sort((a, b) => RARITY_ORDER.indexOf(b.rarity) - RARITY_ORDER.indexOf(a.rarity) || a.name.localeCompare(b.name));
  const eggs = (window.EGGS || []).slice().sort((a, b) => RARITY_ORDER.indexOf(b.rarity) - RARITY_ORDER.indexOf(a.rarity) || a.name.localeCompare(b.name));
  // Catalogue des objets échangeables : "pet:Id" et "egg:Id" -> nom, image, rareté
  const ITEMS = new Map([
    ...eggs.map((e) => [`egg:${e.id}`, { name: e.name, img: `images/eggs/${e.id}.jpg`, sub: e.rarity }]),
    ...pets.map((p) => [`pet:${p.id}`, { name: p.name, img: `images/pets/${p.id}.jpg`, sub: p.rarity }]),
  ]);
  const MAX_ITEMS = 8;

  let me = null;      // compte Discord connecté
  let invite = "";    // lien d'invitation du serveur Discord (si configuré)
  const acceptedNow = {}; // tradeId -> lien du salon, juste après une acceptation

  let adminKey = ""; try { adminKey = localStorage.getItem("tradesAdminKey") || ""; } catch (e) { /* ignoré */ }
  if (location.hash === "#admin") { // mode admin : demande la clé une fois, la garde dans ce navigateur
    const key = prompt(t("trades.adminPrompt"), adminKey);
    if (key !== null) { adminKey = key.trim(); try { localStorage.setItem("tradesAdminKey", adminKey); } catch (e) {} if (adminKey) alert(t("trades.admin")); }
  }

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const errorText = (data) => {
    const key = `trades.err.${data && data.error}`;
    return t(I18N[LANG][key] ? key : "trades.err.network");
  };
  // Message d'erreur, avec le lien d'invitation quand il faut rejoindre le serveur
  function errorNode(data) {
    const box = el("span", null, errorText(data) + " ");
    if (data && data.error === "not_member" && (data.invite || invite)) {
      const a = el("a", null, t("trades.join")); a.href = data.invite || invite; a.target = "_blank"; a.rel = "noopener";
      box.appendChild(a);
    }
    return box;
  }

  // ---------- Compte Discord ----------
  function renderAccount() {
    const box = document.getElementById("account");
    if (me) {
      const who = el("span", null, t("trades.loggedAs", { name: me.name }) + " · ");
      const out = el("a", null, t("trades.logout")); out.href = "/api/auth/logout";
      box.replaceChildren(who, out);
    } else {
      const a = el("a", "btn discord", t("trades.login")); a.href = "/api/auth/login";
      box.replaceChildren(a);
    }
    document.getElementById("form").hidden = !me;
    document.getElementById("loginPrompt").hidden = !!me;
  }

  // ---------- Formulaire : grille de pets cliquables ----------
  const sel = { have: [], want: [] };
  function toggle(side, ref) {
    if (sel[side].includes(ref)) sel[side] = sel[side].filter((r) => r !== ref);
    else if (sel[side].length < MAX_ITEMS) sel[side].push(ref);
    renderSelection();
  }
  function buildGrid(side) {
    const grid = document.getElementById(`${side}Grid`);
    const tileFor = (ref, info) => {
      const tile = el("button", "pick-tile");
      tile.type = "button"; tile.dataset.ref = ref; tile.dataset.name = info.name.toLowerCase();
      tile.style.setProperty("--c", RARITY_COLOR[info.sub] || "#777");
      const img = el("img"); img.loading = "lazy"; img.width = 72; img.height = 72; img.alt = ""; img.src = info.img;
      tile.append(img, el("span", "pick-name", info.name), el("span", "pick-rk", info.sub));
      tile.onclick = () => toggle(side, ref);
      return tile;
    };
    // Œufs d'abord, puis les pets, chacun sous un petit titre
    const nodes = [];
    for (const [prefix, list, headKey] of [["egg", eggs, "trades.eggsHead"], ["pet", pets, "trades.petsHead"]]) {
      if (!list.length) continue;
      const head = el("div", "pick-head", t(headKey)); head.dataset.i18n = headKey; // traduit au changement de langue
      nodes.push(head);
      for (const x of list) nodes.push(tileFor(`${prefix}:${x.id}`, ITEMS.get(`${prefix}:${x.id}`)));
    }
    grid.replaceChildren(...nodes);
    const search = document.getElementById(`${side}Search`);
    search.oninput = () => {
      const term = search.value.trim().toLowerCase();
      grid.querySelectorAll(".pick-tile").forEach((tile) => { tile.hidden = term && !tile.dataset.name.includes(term); });
    };
  }
  function itemChip(ref, onRemove) {
    const info = ITEMS.get(ref) || { name: ref.split(":")[1], img: "" };
    const chip = el("span", "item");
    const img = el("img"); img.src = info.img; img.alt = ""; img.loading = "lazy";
    chip.append(img, el("span", null, info.name));
    if (onRemove) {
      const rm = el("button", "rm", "✕"); rm.type = "button";
      rm.setAttribute("aria-label", `${t("trades.delete")} ${info.name}`); rm.onclick = onRemove;
      chip.appendChild(rm);
    }
    return chip;
  }
  function renderSelection() {
    for (const side of ["have", "want"]) {
      document.getElementById(`${side}Items`).replaceChildren(...sel[side].map((ref) => itemChip(ref, () => toggle(side, ref))));
      document.getElementById(`${side}Count`).textContent = `${sel[side].length}/${MAX_ITEMS}`;
      const full = sel[side].length >= MAX_ITEMS;
      document.querySelectorAll(`#${side}Grid .pick-tile`).forEach((tile) => {
        const on = sel[side].includes(tile.dataset.ref);
        tile.setAttribute("aria-pressed", String(on));
        tile.disabled = full && !on; // plus de place : seuls les pets déjà choisis restent cliquables
      });
    }
  }
  buildGrid("have"); buildGrid("want");

  const form = document.getElementById("form");
  const kindOf = () => form.querySelector('input[name="kind"]:checked').value;
  function updateKind() { // une recherche n'a pas de partie "J'offre"
    const request = kindOf() === "request";
    document.getElementById("haveBox").hidden = request;
    document.getElementById("wantLegend").textContent = t(request ? "trades.wantSearch" : "trades.want");
  }
  form.querySelectorAll('input[name="kind"]').forEach((r) => (r.onchange = updateKind));

  const msg = document.getElementById("formMsg");
  const showMsg = (node, ok) => { msg.replaceChildren(typeof node === "string" ? document.createTextNode(node) : node); msg.className = "form-msg " + (ok ? "ok" : "err"); };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const kind = kindOf();
    const body = { kind, have: kind === "request" ? [] : sel.have, want: sel.want, note: document.getElementById("note").value, roblox: document.getElementById("roblox").value.trim() };
    const btn = document.getElementById("publish"); btn.disabled = true;
    try {
      const res = await fetch("/api/trades", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { showMsg(errorNode(data), false); return; }
      try { localStorage.setItem("tradeRoblox", body.roblox); } catch (e) {}
      sel.have = []; sel.want = []; renderSelection(); document.getElementById("note").value = "";
      showMsg(t("trades.published"), true);
      trades.unshift(data.trade); renderList();
    } catch (err) {
      showMsg(t("trades.err.network"), false);
    } finally { btn.disabled = false; }
  };
  try { document.getElementById("roblox").value = localStorage.getItem("tradeRoblox") || ""; } catch (e) {}

  // ---------- Liste des annonces ----------
  let trades = [];
  let loadState = "loading";
  const list = document.getElementById("list");
  const q = document.getElementById("q");
  const kindFilter = document.getElementById("kindFilter");
  q.oninput = kindFilter.onchange = () => renderList();

  function ago(ts) {
    const rtf = new Intl.RelativeTimeFormat(LANG, { numeric: "auto" });
    const min = Math.round((ts - Date.now()) / 60000);
    if (Math.abs(min) < 60) return rtf.format(min, "minute");
    const h = Math.round(min / 60);
    return Math.abs(h) < 24 ? rtf.format(h, "hour") : rtf.format(Math.round(h / 24), "day");
  }

  async function accept(tr, card) {
    if (!confirm(t("trades.confirmAccept", { name: tr.author.name }))) return;
    const res = await fetch(`/api/trades/accept?id=${encodeURIComponent(tr.id)}`, { method: "POST" }).catch(() => null);
    const data = res ? await res.json().catch(() => ({})) : {};
    if (res && res.ok) {
      acceptedNow[tr.id] = data.channelUrl;
      trades = trades.map((x) => (x.id === tr.id ? data.trade : x));
      renderList();
      return;
    }
    if (data.error === "already_taken") loadTrades(); // quelqu'un a été plus rapide : on rafraîchit
    const err = card.querySelector(".card-msg") || card.appendChild(el("p", "form-msg err card-msg"));
    err.replaceChildren(errorNode(data));
  }

  function renderList() {
    const term = q.value.trim().toLowerCase();
    const shown = trades.filter((tr) => {
      if (kindFilter.value !== "all" && tr.kind !== kindFilter.value) return false;
      if (!term) return true;
      const names = [...tr.have, ...tr.want].map((r) => (ITEMS.get(r)?.name || r).toLowerCase());
      return names.some((n) => n.includes(term)) || tr.roblox.toLowerCase().includes(term) || tr.author.name.toLowerCase().includes(term);
    });

    list.replaceChildren(...shown.map((tr) => {
      const card = el("article", "trade");
      const head = el("div", "trade-head");
      head.append(el("span", `kind ${tr.kind} outline`, t(`trades.badge.${tr.kind}`)), el("span", "when", ago(tr.createdAt)));
      card.appendChild(head);

      const side = (labelKey, refs) => {
        const box = el("div", "side");
        const items = el("div", "items");
        if (refs.length) items.append(...refs.map((r) => itemChip(r)));
        else items.appendChild(el("span", null, t("trades.anything")));
        box.append(el("span", null, t(labelKey)), items);
        return box;
      };
      if (tr.kind === "offer") card.appendChild(side("trades.offers", tr.have));
      card.appendChild(side(tr.kind === "offer" ? "trades.wants" : "trades.wantSearch", tr.want));
      if (tr.note) card.appendChild(el("p", "note", tr.note));

      const contact = el("div", "contact");
      const dc = el("span", null, "Discord : "); dc.appendChild(el("b", null, tr.author.name));
      const rb = el("span", null, "Roblox : "); rb.appendChild(el("b", null, tr.roblox));
      contact.append(dc, rb);
      card.appendChild(contact);

      const mine = me && me.id === tr.author.id;
      const participant = me && (mine || (tr.acceptedBy && tr.acceptedBy.id === me.id));
      const actions = el("div", "row");
      if (tr.status === "in_progress" || tr.status === "accepting") {
        card.classList.add("taken");
        card.appendChild(el("p", "status", t("trades.inProgress", { name: tr.acceptedBy ? tr.acceptedBy.name : "?" })));
        const link = acceptedNow[tr.id] || (participant && window.GUILD_ID && tr.channelId ? `https://discord.com/channels/${window.GUILD_ID}/${tr.channelId}` : "");
        if (acceptedNow[tr.id]) card.appendChild(el("p", "form-msg ok", t("trades.accepted")));
        if (link) { const a = el("a", "btn discord", t("trades.openChannel")); a.href = link; a.target = "_blank"; a.rel = "noopener"; actions.appendChild(a); }
      } else if (!mine) {
        if (me) { const b = el("button", "btn green", t("trades.accept")); b.type = "button"; b.onclick = () => accept(tr, card); actions.appendChild(b); }
        else { const a = el("a", "btn discord", t("trades.loginToAccept")); a.href = "/api/auth/login"; actions.appendChild(a); }
      }
      if (mine || adminKey) {
        const del = el("button", "btn red", t("trades.delete")); del.type = "button";
        del.onclick = async () => {
          if (!confirm(t("trades.confirmDelete"))) return;
          const headers = adminKey && !mine ? { "x-admin-key": adminKey } : {};
          const res = await fetch(`/api/trades?id=${encodeURIComponent(tr.id)}`, { method: "DELETE", headers }).catch(() => null);
          if (res && res.ok) { trades = trades.filter((x) => x.id !== tr.id); renderList(); }
        };
        actions.appendChild(del);
      }
      if (actions.children.length) card.appendChild(actions);
      return card;
    }));

    document.getElementById("count").textContent = loadState === "ok" ? t("trades.count", { n: shown.length, s: shown.length > 1 ? "s" : "" }) : "";
    const empty = document.getElementById("empty");
    empty.hidden = shown.length > 0;
    empty.textContent = loadState === "loading" ? t("trades.loading") : loadState === "error" ? t("trades.loadError") : t("trades.empty");
  }

  async function loadTrades() {
    try {
      const res = await fetch("/api/trades", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      trades = (await res.json()).trades || []; loadState = "ok";
    } catch (e) { loadState = "error"; }
    renderList();
  }

  async function loadMe() {
    try {
      const data = await (await fetch("/api/auth/me", { cache: "no-store" })).json();
      me = data.user; invite = data.invite || ""; window.GUILD_ID = data.guildId || "";
    } catch (e) { me = null; }
    renderAccount(); renderList();
    if (new URLSearchParams(location.search).get("login") === "error") showMsg(t("trades.err.login"), false);
  }

  window.onLangChange = () => { updateKind(); renderSelection(); renderAccount(); renderList(); };
  window.onLangChange();
  loadMe();
  loadTrades();
</script>
</body>
</html>
